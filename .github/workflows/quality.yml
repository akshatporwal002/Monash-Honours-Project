name: Quality and release gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src-main

jobs:
  backend:
    name: Backend / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: src-main/.python-version

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"
          enable-cache: true
          cache-dependency-glob: src-main/backend/uv.lock

      - name: Verify and install locked dependencies
        working-directory: src-main/backend
        run: |
          uv lock --check
          uv sync --frozen --all-extras

      - name: Ruff check
        working-directory: src-main/backend
        run: uv run --frozen ruff check .

      - name: Ruff format check
        working-directory: src-main/backend
        run: uv run --frozen ruff format --check .

      - name: Backend tests including migrations
        working-directory: src-main/backend
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./ci-tests.db
          LEARNING_EVENT_PSEUDONYM_SECRET: ci-only-pseudonym-secret-32-bytes-minimum
        run: >
          uv run --frozen pytest
          --cov=app.services
          --cov-report=term-missing
          --cov-fail-under=80

      - name: OpenAPI contract drift
        working-directory: src-main/backend
        env:
          APP_ENV: test
          LEARNING_EVENT_PSEUDONYM_SECRET: ci-only-pseudonym-secret-32-bytes-minimum
        run: |
          uv run --frozen python scripts/export_openapi.py --check
          uv run --frozen python scripts/generate_frontend_contracts.py --check

  frontend:
    name: Frontend / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: src-main/.python-version

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"
          enable-cache: true
          cache-dependency-glob: src-main/backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version-file: src-main/.nvmrc
          cache: npm
          cache-dependency-path: src-main/frontend/package-lock.json

      - name: Install locked browser E2E backend
        working-directory: src-main/backend
        run: |
          uv lock --check
          uv sync --frozen --all-extras

      - name: Install locked dependencies
        working-directory: src-main/frontend
        run: npm ci

      - name: Lint
        working-directory: src-main/frontend
        run: npm run lint

      - name: Unit and accessibility tests
        working-directory: src-main/frontend
        run: npm test

      - name: Production build
        working-directory: src-main/frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: src-main/frontend
        run: npx playwright install --with-deps chrome msedge firefox webkit

      - name: Browser E2E
        working-directory: src-main/frontend
        run: npm run test:e2e

      - name: Complete learning loop with real worker
        working-directory: src-main/frontend
        run: npm run test:e2e:learning-loop
      - name: Misconception learning checks
        working-directory: src-main/frontend
        run: npm run test:e2e:misconceptions

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: src-main/.python-version

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"

      - uses: actions/setup-node@v4
        with:
          node-version-file: src-main/.nvmrc
          cache: npm
          cache-dependency-path: src-main/frontend/package-lock.json

      - name: Verify Python lock
        working-directory: src-main/backend
        run: |
          uv lock --check
          uv sync --frozen --all-extras

      - name: Audit Python dependency environment
        working-directory: src-main/backend
        run: uv run --frozen --with pip-audit==2.9.0 pip-audit --skip-editable

      - name: Audit npm full and production dependency trees
        working-directory: src-main/frontend
        run: |
          audit_with_retry() {
            local label="$1"
            shift

            for attempt in 1 2 3; do
              echo "$label audit attempt $attempt of 3"
              if timeout 60s npm audit "$@"; then
                return 0
              fi

              if [ "$attempt" -lt 3 ]; then
                sleep 10
              fi
            done

            echo "::error::$label npm audit failed after 3 attempts"
            return 1
          }

          npm ci --audit=false
          audit_with_retry "Full dependency tree" --audit-level=high
          audit_with_retry "Production dependency tree" --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p gitleaks-8.28.0
          cd gitleaks-8.28.0
          curl --fail --location --retry 3 --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo 'a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Verify full history and secret detection
        working-directory: ${{ github.workspace }}
        run: |
          python3 .github/scripts/test_secret_scan.py
          python3 .github/scripts/secret_scan.py \
            --gitleaks "$RUNNER_TEMP/gitleaks-8.28.0/gitleaks" \
            --report-dir "$RUNNER_TEMP/secret-scan"

      - name: Retain redacted secret-scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-evidence
          path: ${{ runner.temp }}/secret-scan/*.*
          if-no-files-found: warn
