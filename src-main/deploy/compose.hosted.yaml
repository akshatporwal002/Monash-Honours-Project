x-hosted-environment: &hosted-environment
  APP_ENV: production
  API_DOCS_ENABLED: "false"
  BOOTSTRAP_DEMO: "false"
  SESSION_COOKIE_SECURE: "true"
  FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public HTTPS origin}
  CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to the public HTTPS origin}
  SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?Set a unique SESSION_SECRET_KEY}
  LEARNING_EVENT_PSEUDONYM_SECRET: ${LEARNING_EVENT_PSEUDONYM_SECRET:?Set a unique LEARNING_EVENT_PSEUDONYM_SECRET}

services:
  backend:
    environment: *hosted-environment
  worker:
    environment: *hosted-environment
