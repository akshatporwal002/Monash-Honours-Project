[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumlearn-api"
version = "0.1.0"
description = "FastAPI backend for QuantumLearn"
requires-python = "==3.11.*"
dependencies = [
    "alembic>=1.14,<2.0",
    "argon2-cffi>=23.1,<26.0",
    "beautifulsoup4>=4.13,<5.0",
    "email-validator>=2.2,<3.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "PyJWT>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "python-pptx>=1.0,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
quantumlearn-provision-admin = "app.provision_admin:main"
quantumlearn-worker = "app.worker:main"

[project.optional-dependencies]
quantum = [
    "qiskit>=1.3,<3.0",
    "qiskit-aer>=0.16,<1.0",
]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest>=9.0.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff==0.16.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
